# main dalına gönderimde (veya elle) Windows, macOS ve Linux kurulum
# dosyalarını derler ve package.json'daki sürümle (örn. v0.1.0) GitHub
# Releases'e yükler; etiketi GitHub kendisi oluşturur. İndirme sayfasındaki
# düğmeler sabit adlı dosyalara bağlanır: releases/latest/download/<ad>.
name: Sürüm yayınla

on:
  push:
    branches: [main]
    paths: ["src/**", "src-tauri/**", "package.json", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
          - os: ubuntu-22.04
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux bağımlılıkları
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Sürüm etiketi
        shell: bash
        run: echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "West Client ${{ env.TAG }}"
          # Sürüm notları = son commit mesajı (launcher'daki güncelleme penceresinde gösterilir)
          releaseBody: ${{ github.event.head_commit.message || 'West Client güncellemesi' }}
          releaseDraft: false
          args: ${{ matrix.args }}

      # İndirme sayfasının her zaman aynı adrese bağlanabilmesi için sabit adlı kopyalar
      - name: Sabit adlı dosyaları yükle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          B=src-tauri/target
          case "${{ matrix.os }}" in
            windows-latest) cp "$(ls $B/release/bundle/nsis/*-setup.exe | head -1)" West-Launcher-Setup.exe; F=West-Launcher-Setup.exe ;;
            macos-latest)   cp "$(ls $B/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" West-Launcher-macOS.dmg; F=West-Launcher-macOS.dmg ;;
            ubuntu-22.04)   cp "$(ls $B/release/bundle/deb/*.deb | head -1)" West-Launcher-Linux.deb
                            cp "$(ls $B/release/bundle/appimage/*.AppImage | head -1)" West-Launcher-Linux.AppImage
                            F="West-Launcher-Linux.deb West-Launcher-Linux.AppImage" ;;
          esac
          # Yeni adlı kopyalar (indirme sayfası); eski adlar eski sürümlerin otomatik güncellemesi için kalır
          for f in $F; do cp "$f" "${f/West-Launcher/West-Client}"; F="$F ${f/West-Launcher/West-Client}"; done
          gh release upload "$TAG" $F --clobber
