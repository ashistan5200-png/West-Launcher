plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.148"
}

version = "${project.mod_version}+neoforge-${project.minecraft_version}"
group = "dev.west.companion"
base { archivesName = "west-companion" }

sourceSets.main {
    java.srcDir "../common/src/main/java"
    resources.srcDir "../common/src/main/resources"
}

neoForge {
    version = project.neo_version
    mods { west_companion { sourceSet sourceSets.main } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") { expand "version": project.version }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 21 }
