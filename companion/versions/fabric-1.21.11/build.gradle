plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+fabric-${project.minecraft_version}"
group = "dev.west.companion"
base { archivesName = "west-companion" }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Resmi Mojang adları: çekirdek ve 26.x adaptörüyle aynı adlandırma
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Grup sesli sohbeti: saf Java Opus kodlayıcı (yerel kütüphane gerekmez), modun içine gömülür
    implementation "io.github.jaredmdobson:concentus:1.0.2"
    include "io.github.jaredmdobson:concentus:1.0.2"
}

sourceSets.main.java.srcDir "../../core/src/main/java"
sourceSets.main.resources.srcDir "../../core/src/main/resources"

loom {
    mixin { defaultRefmapName = "west_companion.refmap.json" }
}

processResources {
    def v = project.version
    inputs.property "version", v
    filesMatching("fabric.mod.json") { expand "version": v }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = "UTF-8" }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    accessWidenerPath = file("src/main/resources/west_companion.accesswidener")
}
