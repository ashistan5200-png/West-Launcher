plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+fabric-${project.minecraft_version}"
group = "dev.west.companion"
base { archivesName = "west-companion" }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Sürümden bağımsız çekirdek (HUD, menü, düzenleyici) bu modun içine derlenir
sourceSets.main.java.srcDir "../../core/src/main/java"

processResources {
    def v = project.version
    inputs.property "version", v
    filesMatching("fabric.mod.json") { expand "version": v }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = "UTF-8" }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

loom {
    accessWidenerPath = file("src/main/resources/west_companion.accesswidener")
}
